# gitleaks configuration for RingView.
#
# Runs as a pre-commit hook (.githooks/pre-commit) and in CI (ci.yml). Extends the bundled
# default ruleset and adds RingView-specific rules so a Ring refresh token can never be
# committed.

[extend]
useDefault = true

[[rules]]
id = "ring-refresh-token-assignment"
description = "Ring refresh token assigned in source or env file"
# Matches RING_REFRESH_TOKEN=<non-empty> or refreshToken: "<long string>"
regex = '''(?i)(ring[_-]?refresh[_-]?token|refreshtoken)\s*[:=]\s*['"]?[A-Za-z0-9._\-]{20,}'''
keywords = ["refresh_token", "refreshtoken", "ring_refresh_token"]

[[rules]]
id = "ring-credentials-blob"
description = "Encrypted credentials blob accidentally added"
path = '''credentials\.bin$'''

[allowlist]
description = "Ignore the config and docs, and the redactor's intentional fixtures"
paths = [
  '''\.gitleaks\.toml$''',
  '''(^|/)Docs/.*\.md$''',
  # The Electron app's logging tests (removed, still in history) deliberately contained
  # secret-shaped strings (a fake JWT, Bearer token, etc.) to verify redaction.
  '''(^|/)(electron/main|src/main)/logging/.*\.test\.ts$''',
]
# The placeholder assignments in docs are not real secrets.
regexes = [
  '''RING_REFRESH_TOKEN=\s*$''',
]
