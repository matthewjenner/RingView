name: Release

# Manual release. The source repo (matthewjenner/RingView) stays PRIVATE; the
# installer + latest.yml are published to the PUBLIC repo matthewjenner/RingView-releases
# so auto-update works without a token in the shipped app.
#
# Flow: bump the version locally (scripts/bump-version.sh) -> commit -> push.
# Then trigger this workflow from the Actions tab ("Run workflow"). It reads the
# version from package.json; if a v<version> release already exists in the
# releases repo it's a clean no-op, otherwise it tests, builds, and publishes.
# No pipeline-side commits or CI-made bumps.

on:
  workflow_dispatch:

# We only read this (private) repo; publishing happens to the public releases
# repo via a PAT, not the default GITHUB_TOKEN.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Public repo that receives the installer + latest.yml (keep in sync with
  # electron-builder.yml `publish`). Requires the GH_TOKEN secret below.
  RELEASES_REPO: matthewjenner/RingView-releases

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Read version from package.json
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [[ -z "$v" ]]; then
            echo "Could not read version from package.json" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"
          echo "TAG=v$v"    >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Check whether this release already exists
        id: tag-check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.TAG }}"
          if gh release view "$tag" --repo "$RELEASES_REPO" --json tagName >/dev/null 2>&1; then
            echo "Release $tag already exists in $RELEASES_REPO - nothing to do."
            echo "SKIP=true"  >> "$GITHUB_OUTPUT"
          else
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag-check.outputs.SKIP == 'false'
        run: npm ci

      - name: Lint & format check
        if: steps.tag-check.outputs.SKIP == 'false'
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        if: steps.tag-check.outputs.SKIP == 'false'
        run: npm run typecheck

      - name: Test
        if: steps.tag-check.outputs.SKIP == 'false'
        run: npm test

      # Pre-create the (published) release so electron-builder only UPLOADS to it.
      # electron-builder otherwise spins up two publisher tasks that each try to
      # create the release, racing into duplicate releases. The releases repo must
      # have at least one commit (a default branch) for the tag to be created.
      - name: Create the release
        if: steps.tag-check.outputs.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.TAG }}"
          gh release create "$tag" --repo "$RELEASES_REPO" --title "$tag" --notes "RingView $tag"

      - name: Build and upload to the release
        if: steps.tag-check.outputs.SKIP == 'false'
        env:
          # PAT with contents:write on RELEASES_REPO. electron-builder reads
          # GH_TOKEN to upload the installer + blockmap + latest.yml to the
          # release created above (it finds it by tag, so it won't re-create).
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          npm run build
          npx electron-builder --win --publish always
