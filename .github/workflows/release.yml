name: Release

# The .NET app's Velopack release, published to this repo's own GitHub releases (the Klakr
# pattern). Runs on every push to main and is idempotent on the version: if the release for
# the current VersionPrefix already exists, the job ends without doing anything.
#
# Flow: Scripts/bump-version.sh -> commit -> push -> release.
#
# 0.0.0 never publishes. It also refuses to publish while this repo is private, since
# installed copies read the releases without a token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Read version from Directory.Build.props
        id: version
        run: |
          v=$(grep -oE '<VersionPrefix>[^<]+</VersionPrefix>' Directory.Build.props \
              | sed -E 's|</?VersionPrefix>||g' \
              | tr -d '[:space:]')
          if [[ -z "$v" ]]; then
              echo "Could not read VersionPrefix from Directory.Build.props" >&2
              exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_OUTPUT"
          echo "TAG=v$v"    >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.TAG }}"
          if [[ "${{ steps.version.outputs.VERSION }}" == "0.0.0" ]]; then
              echo "VersionPrefix is 0.0.0 (the rewrite has not shipped) - nothing to do."
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --json tagName >/dev/null 2>&1; then
              echo "Release $tag already exists - nothing to do."
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" != "PUBLIC" ]]; then
              echo "This repo is private: installed copies could not read the release. Make it public first." >&2
              exit 1
          else
              echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.gate.outputs.SKIP == 'false'
        run: dotnet test --solution RingView.slnx --configuration Release

      - name: Publish
        if: steps.gate.outputs.SKIP == 'false'
        run: |
          dotnet publish Src/RingView.App/RingView.App.csproj \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              --output publish

      - name: Install Velopack CLI
        if: steps.gate.outputs.SKIP == 'false'
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Pack with Velopack
        if: steps.gate.outputs.SKIP == 'false'
        run: |
          vpk pack \
              --packId RingView \
              --packVersion "${{ steps.version.outputs.VERSION }}" \
              --packDir publish \
              --mainExe RingView.exe \
              --runtime win-x64 \
              --packTitle RingView \
              --icon Src/RingView.App/Assets/icon.ico

      - name: Create GitHub release
        if: steps.gate.outputs.SKIP == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.TAG }}"
          gh release create "$tag" Releases/* --title "RingView $tag" --notes ""
