appId: me.jenner.ringview
productName: RingView
copyright: Copyright © Matthew Jenner

directories:
  output: release
  # NOTE: do NOT point buildResources at our runtime `resources/` dir — electron
  # builder EXCLUDES the buildResources folder from the app, which would drop the
  # tray/app icons and break Tray (blank icon) and the window icon at runtime.
  buildResources: build

# Include everything except sources/configs (out/, node_modules, package.json
# are picked up by default). Mirrors the electron-vite recommended ignore list.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.{test,spec}.{js,ts,tsx}'
  - '!{.env,.env.*,.env.example}'
  - '!{.gitignore,.gitattributes,.gitleaks.toml,.nvmrc}'
  - '!{README.md,CLAUDE.md,LICENSE}'
  - '!{Docs,docs}/**'
  - '!scripts/**'
  - '!.github/**'
  - '!{eslint.config.js,.prettierrc.json,.prettierignore,.gitleaks.toml,.nvmrc}'
  - '!{favicon.ico,electron-builder.yml,.husky/**}'
  # Drop the unused 2nd ffmpeg. ring-client-api's camera-utils bundles
  # ffmpeg-for-homebridge (~112 MB) plus its .build download cache (another
  # ~112 MB). We always set ffmpeg-static via setFfmpegPath, so streaming uses
  # getFfmpegPath() and camera-utils' defaultFfmpegPath (ffmpeg-for-homebridge)
  # is never invoked. Its index.js returns undefined when the binary is absent
  # (→ harmless 'ffmpeg' string fallback), so dropping the .exe can't crash the
  # import. Keeps the package's index.js; only the binaries are excluded.
  - '!node_modules/ffmpeg-for-homebridge/ffmpeg.exe'
  - '!node_modules/ffmpeg-for-homebridge/.build/**'

# Ship WITHOUT asar. Some deps (@shinyoshiaki/binary-data via werift/ring-client-api)
# use an INTERNAL node_modules folder for bare-specifier requires
# (`require('lib/binary-stream')`). electron-builder's collector strips nested
# node_modules, and an asar header won't reference files re-added afterwards — so
# the require fails inside an asar. With plain files, afterPack restores the
# stripped folder and Node resolves it normally on disk.
# (ffmpeg-static then needs no asarUnpack, and RingService's app.asar path rewrite
# becomes a harmless no-op since there's no app.asar in the path.)
asar: false

# Restore internal node_modules that electron-builder's collector strips.
afterPack: ./scripts/after-pack.cjs

win:
  icon: resources/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: RingView

# Source stays private (matthewjenner/RingView); installers + latest.yml are
# published to a SEPARATE PUBLIC repo so auto-update works without embedding a
# token in the shipped app. This `publish` block is also baked into the app's
# app-update.yml, so electron-updater reads from the public repo at runtime.
publish:
  provider: github
  owner: matthewjenner
  repo: RingView-releases
  # Publish a real (non-draft) release, NOT electron-builder's default draft.
  # Drafts have no git tag, so (a) electron-updater can't read latest.yml from
  # them and (b) the workflow's `gh release view <tag>` idempotency check never
  # finds them and re-publishes duplicates on every run.
  releaseType: release
